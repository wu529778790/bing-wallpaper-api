name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      preid:
        description: Pre-release identifier, used only for prerelease
        required: true
        default: test
        type: choice
        options:
          - test
          - beta
          - rc
      npm_tag:
        description: npm dist-tag
        required: true
        default: auto
        type: choice
        options:
          - auto
          - latest
          - next
          - test
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  manual-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version
        id: version
        shell: bash
        run: |
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          PREID="${{ github.event.inputs.preid }}"

          if [[ "$RELEASE_TYPE" == "prerelease" ]]; then
            npm version prerelease --preid "$PREID" -m "chore: release v%s"
          else
            npm version "$RELEASE_TYPE" -m "chore: release v%s"
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine npm tag
        id: dist_tag
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.npm_tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          if [[ "$INPUT_TAG" != "auto" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$VERSION" == *"-"* ]]; then
            TAG="test"
          else
            TAG="latest"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        run: |
          git push origin HEAD:${{ github.event.repository.default_branch }}
          git push origin --tags

      - name: Publish to npm
        run: npm publish --provenance --tag ${{ steps.dist_tag.outputs.tag }}

  tag-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version: $TAG_VERSION"
            echo "Package version: $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build package
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Determine npm tag
        id: dist_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME#v}" == *"-"* ]]; then
            echo "tag=test" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --provenance --tag ${{ steps.dist_tag.outputs.tag }}
